version: '3.8'

services:
  blueteamers_db:
    image: postgres:16-alpine
    container_name: blueteamers_db
    environment:
      POSTGRES_DB: blueteamers_db
      POSTGRES_USER: blueteamers_user
      POSTGRES_PASSWORD: blueteamers_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueteamers_user -d blueteamers_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  blueteamers_redis:
    image: redis:7-alpine
    container_name: blueteamers_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  blueteamers_api:
    build: .
    container_name: blueteamers_api
    # ASGI (UvicornWorker) — serves HTTP + WebSockets from one process
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 -k uvicorn.workers.UvicornWorker
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-django-insecure-production-secret-key-change-me}
      DEBUG: "False"
      DATABASE_URL: postgres://blueteamers_user:blueteamers_password@blueteamers_db:5432/blueteamers_db
      REDIS_URL: redis://blueteamers_redis:6379/0
      ALLOWED_HOSTS: "*"
    depends_on:
      blueteamers_db:
        condition: service_healthy
      blueteamers_redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles

  blueteamers_celery_worker:
    build: .
    container_name: blueteamers_celery_worker
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://blueteamers_user:blueteamers_password@blueteamers_db:5432/blueteamers_db
      REDIS_URL: redis://blueteamers_redis:6379/0
    depends_on:
      - blueteamers_api
      - blueteamers_redis

  blueteamers_celery_beat:
    build: .
    container_name: blueteamers_celery_beat
    command: celery -A config beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://blueteamers_user:blueteamers_password@blueteamers_db:5432/blueteamers_db
      REDIS_URL: redis://blueteamers_redis:6379/0
    depends_on:
      - blueteamers_api
      - blueteamers_redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
